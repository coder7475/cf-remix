<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Keep or remove for transparent) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Vibrant Electric Cyan-to-Blue -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Indigo-Violet Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-robiul {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.5px;
      fill: #FFFFFF;
    }
    .brand-hossain {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.5px;
      fill: url(#primaryGrad);
    }
    .dot-accent {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 900;
      font-size: 36px;
      fill: #38BDF8;
    }
  </style>

  <!-- Background Base (Remove this rect if you prefer transparent) -->
  <rect width="100%" height="100%" rx="14" fill="url(#bgGrad)" />

  <!-- Monogram Mark (R + H Modern Geometry) -->
  <g transform="translate(28, 18)" filter="url(#subtleGlow)">
    <!-- Left vertical bar (Stem of R) -->
    <rect x="0" y="0" width="8.5" height="54" rx="4.25" fill="url(#primaryGrad)" />
    
    <!-- Outer R Loop -->
    <path d="M 8.5 4.5 H 24 C 34 4.5, 41 11, 41 21 C 41 31, 34 37.5, 24 37.5 H 8.5" fill="none" stroke="url(#primaryGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Intersecting bridge bar -->
    <rect x="20" y="24" width="22" height="7.5" rx="3.75" fill="url(#primaryGrad)" />
    
    <!-- Right vertical bar (H Pillar) -->
    <rect x="36" y="0" width="8.5" height="54" rx="4.25" fill="url(#accentGrad)" />

    <!-- Terminal Anchor Accent (Lower leg of R) -->
    <circle cx="25" cy="48" r="4.25" fill="#00F2FE" />
  </g>

  <!-- Typography: Centered vertically against the icon -->
  <text x="100" y="56" class="brand-robiul">
    ROBIUL <tspan class="brand-hossain">HOSSAIN</tspan><tspan class="dot-accent">.</tspan>
  </text>
</svg>